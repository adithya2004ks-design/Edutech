{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4">

            <h3 class="text-center mb-4">Student Signup</h3>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <input class="form-control mb-3" type="text" name="name" placeholder="Full Name" required>
                <input class="form-control mb-3" type="text" name="register_no" placeholder="Register Number" required>
                <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>

                <button class="btn btn-success w-100">Sign Up</button>
            </form>

            <p class="text-center mt-3">
                Already have account? <a href="/login">Login</a>
            </p>

        </div>
    </div>
</div>

{% endblock %}
